# Overrides on top of Cowrie 3.x defaults (etc/cowrie.cfg).
# Everything not listed here uses the bundled cowrie.cfg.dist.

[honeypot]
# Generic name; avoids Cowrie's default "svr04" fingerprint
hostname = <fake-hostname>
# Cap captured payloads at 10 MB to protect the 64 GB disk
download_limit_size = 10485760
# Override files (/etc/hostname, /etc/hosts) for the fake filesystem
contents_path = /home/cowrie/my-honeypot/honeyfs
# Emulated shell only; never "proxy" (would pass attackers to a real system)
backend = shell

[ssh]
# Unprivileged port; iptables redirects public 22 here
listen_endpoints = tcp:2222:interface=0.0.0.0
# Block direct-tcpip tunnels so bots can't use the honeypot as a proxy (AUP)
forwarding = false

[telnet]
# Capture Mirai-style IoT botnet traffic
enabled = true
# Unprivileged port; iptables redirects public 23 here
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
# Structured log shipped to Wazuh in Phase 3
enabled = true
